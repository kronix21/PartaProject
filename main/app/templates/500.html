{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка сервера (500)</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="error-page">
        <div class="error-code">500</div>
        <h1 class="error-title">Внутренняя ошибка сервера</h1>
        <p class="error-text">
            Что-то пошло не так. Мы уже работаем над исправлением.<br>
            Попробуйте вернуться на главную или повторить попытку позже.
        </p>
        <div class="error-actions">
            <a href="{% url 'index' %}" class="error-btn">На главную</a>
        </div>
    </div>
</body>
</html>
